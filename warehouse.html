<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คลังสินค้า | AgroConnect</title><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🌱</span>AgroConnect</a><div class="nav-links"><a href="index.html">หน้าแรก</a><a href="account.html">บัญชีของฉัน</a><a href="live.html">Live</a></div><a class="btn btn-white" href="cart.html">🛒 ตะกร้า</a></div></nav><main class="page"><div class="container"><div class="section-head"><div><h1 class="page-title">🏠 คลังสินค้าและโกดัง</h1><p class="muted">เจ้าของโกดังลงประกาศพื้นที่ พร้อมระบุว่าว่างหรือไม่ว่าง</p></div><a class="view-all" href="index.html">← หน้าแรก</a></div><section class="panel form-card"><h2>ลงประกาศโกดังของฉัน</h2><form id="warehouseForm" class="account-form"><label>ชื่อโกดัง / ประกาศ</label><input class="field" name="title" required placeholder="เช่น โกดังเก็บข้าว 500 ตัน"><label>จังหวัด / พื้นที่</label><input class="field" name="province" required><label>ความจุหรือขนาด</label><input class="field" name="capacity" placeholder="เช่น 500 ตัน หรือ 200 ตร.ม."><label>สถานะพื้นที่</label><select class="field" name="status"><option>ว่าง</option><option>ไม่ว่าง</option></select><label>รายละเอียด</label><textarea class="field" name="details" rows="3" placeholder="ประเภทสินค้าที่รับเก็บ เงื่อนไข และช่องทางติดต่อ"></textarea><label>รูปโกดัง (ไม่เกิน 2 MB)</label><input id="warehousePhoto" class="field" name="photo" type="file" accept="image/*"><button class="btn btn-primary" type="submit">เผยแพร่ประกาศ</button></form></section><section class="section"><h2>ประกาศโกดัง</h2><div id="warehouseListings" class="machinery-request-list"></div></section></div></main><div id="toast" class="toast-message"></div><script src="script.js"></script><script src="api-integration.js"></script></body></html>
