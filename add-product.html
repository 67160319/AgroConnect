<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เพิ่มสินค้า | AgroConnect</title><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🌱</span>AgroConnect</a><div class="nav-links"><a href="index.html">หน้าแรก</a><a href="account.html">บัญชีของฉัน</a></div><a class="btn btn-white" href="cart.html">🛒 ตะกร้า</a></div></nav><main class="page"><div class="container"><div class="section-head"><div><h1 class="page-title">＋ เพิ่มสินค้า</h1><p class="muted">เพิ่มรูปสินค้าเพื่อให้ผู้ซื้อเห็นสินค้าได้ชัดเจน</p></div><a class="view-all" href="account.html">← กลับบัญชี</a></div><section class="panel form-card"><form id="listingForm" class="account-form"><label for="listingCategory">ประเภทสินค้า</label><select class="field" id="listingCategory" name="category" required><option value="">เลือกประเภทสินค้า</option><option>ข้าว</option><option>ผลไม้</option><option>ผัก</option><option>มันสำปะหลัง / มันฝรั่ง</option><option>ยางพารา</option><option>ปาล์มน้ำมัน</option><option>ข้าวโพด</option><option>สินค้าเกษตรแปรรูป</option><option>อื่น ๆ</option></select><label for="listingName">ชื่อสินค้า</label><input class="field" id="listingName" name="name" required maxlength="120" placeholder="เช่น ข้าวหอมมะลิ 100%"><div class="form-two"><div><label for="listingPrice">ราคา (บาท)</label><input class="field" id="listingPrice" name="price" type="number" min="0.01" step="0.01" required placeholder="เช่น 45"></div><div><label for="listingUnit">หน่วย</label><select class="field" id="listingUnit" name="unit" required><option value="กก.">กิโลกรัม</option><option value="ตัน">ตัน</option><option value="ถุง">ถุง</option><option value="ลูก">ลูก</option><option value="ลัง">ลัง</option><option value="ลิตร">ลิตร</option><option value="ชุด">ชุด</option><option value="ชิ้น">ชิ้น</option></select></div></div><label for="listingProvince">จังหวัด</label><input class="field" id="listingProvince" name="province" maxlength="100" placeholder="จังหวัดที่สินค้าอยู่" required><label for="listingPhoto">รูปสินค้า (ไม่เกิน 3 MB (ระบบย่อรูปให้อัตโนมัติ))</label><input class="field" id="listingPhoto" name="photo" type="file" accept="image/*" required><img id="listingPhotoPreview" class="listing-photo-preview" alt="ตัวอย่างรูปสินค้า" hidden><p class="muted">รูปจะถูกย่ออัตโนมัติเพื่อให้เหมาะกับการทดลองบน GitHub Pages</p><button class="btn btn-primary" type="submit">ลงขายสินค้า</button></form></section></div></main><div id="toast" class="toast-message"></div><script src="script.js"></script><script src="api-integration.js"></script></body></html>
